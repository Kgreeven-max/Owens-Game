# Arena Brawl - Docker Compose Configuration
version: '3.8'

services:
  # Game Server
  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-brawl-game
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - HOST=0.0.0.0
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - arena-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy (for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: arena-brawl-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - game
    networks:
      - arena-network

networks:
  arena-network:
    driver: bridge

# For local development without nginx:
# docker-compose up game
#
# For production with nginx:
# docker-compose up -d
